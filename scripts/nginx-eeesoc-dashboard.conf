# /etc/nginx/conf.d/eeesoc-dashboard.conf
#
# Nginx reverse-proxies http://<host>:80 (or a dedicated server_name) →
# the eeesoc dashboard at 127.0.0.1:8081.
#
# If julia already owns default_server on :80, either:
#   • give this a distinct server_name / port, or
#   • proxy a path prefix (see commented block below).
#
# Deploy with:
#   sudo cp scripts/nginx-eeesoc-dashboard.conf /etc/nginx/conf.d/eeesoc-dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8081/health;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}

