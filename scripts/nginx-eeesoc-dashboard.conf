# /etc/nginx/conf.d/eeesoc-dashboard.conf
#
# Nginx reverse-proxies http://eeesoc.com / http://www.eeesoc.com →
# the dashboard at 127.0.0.1:8081.
#
# Deploy with:
#   ./scripts/install-nginx-amazon-linux.sh
#   # or manually:
#   sudo cp scripts/nginx-eeesoc-dashboard.conf /etc/nginx/conf.d/eeesoc-dashboard.conf
#   sudo rm -f /etc/nginx/conf.d/default.conf   # if present, steals :80
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS: point A records for eeesoc.com and www.eeesoc.com at this instance.
# Security group: allow inbound TCP 80 (HTTP).

server {
    listen 80;
    listen [::]:80;
    server_name eeesoc.com www.eeesoc.com;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8081/health;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
