# /etc/nginx/conf.d/eeesoc-dashboard.conf
#
# Nginx reverse-proxies http://<host>:80 → eeesoc at 127.0.0.1:8081.
# Same pattern as tekneeq/julia (julia proxies :80 → :8501).
#
# Deploy with:
#   ./scripts/install-nginx-amazon-linux.sh
#   # or manually:
#   sudo cp scripts/nginx-eeesoc-dashboard.conf /etc/nginx/conf.d/eeesoc-dashboard.conf
#   sudo rm -f /etc/nginx/conf.d/default.conf   # if present, steals :80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Security group: allow inbound TCP 80 (HTTP).
#
# If julia already owns default_server on this same box's :80, do NOT install
# this as a second default_server — use a path prefix or another host instead.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8081/health;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
