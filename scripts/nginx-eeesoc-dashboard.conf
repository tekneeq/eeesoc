# /etc/nginx/conf.d/eeesoc-dashboard.conf
#
# HTTP (:80)  — ACME challenge + redirect to HTTPS
# HTTPS (:443) — reverse-proxy to eeesoc at 127.0.0.1:8081
#
# Bootstrap HTTP-only first (./scripts/install-nginx-amazon-linux.sh), then:
#   ./scripts/install-https-letsencrypt.sh
#
# DNS: A records for eeesoc.com + www.eeesoc.com → this instance
# Security group: TCP 80 and TCP 443

# ---- HTTP: Let's Encrypt HTTP-01 + force HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name eeesoc.com www.eeesoc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8081/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eeesoc.com www.eeesoc.com;

    ssl_certificate     /etc/letsencrypt/live/eeesoc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eeesoc.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Optional OCSP stapling (ignored if CA doesn't support it)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/eeesoc.com/chain.pem;

    client_max_body_size 20M;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8081/health;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout  60;
        proxy_send_timeout  60;
    }
}
